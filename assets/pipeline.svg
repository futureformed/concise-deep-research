<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Concise deep research pipeline</title>
  <desc id="d">A question goes to three search providers in parallel. Results are sorted by a System One classifier into a source register. Mid-tier readers build a claim ledger. A top-tier challenger attacks the findings. The top tier writes a short brief with a separate evidence appendix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .h { font-size: 15px; font-weight: 600; }
      .s { font-size: 12px; fill: #94a3b8; }
      .tier { font-size: 11px; font-weight: 600; letter-spacing: .04em; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
      .line { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>

  <text x="40" y="48" class="title">Concise deep research</text>
  <text x="40" y="72" class="sub">Three providers in. One short brief out. Every claim traced to a passage someone read.</text>

  <!-- Question -->
  <g transform="translate(40,120)">
    <rect width="150" height="78" rx="12" class="card"/>
    <text x="16" y="30" class="h">Question</text>
    <text x="16" y="52" class="s">decision, audience,</text>
    <text x="16" y="68" class="s">scope, budget</text>
    <rect x="16" y="-14" width="48" height="16" rx="8" fill="#7c3aed"/>
    <text x="40" y="-2" text-anchor="middle" class="tier">TOP</text>
  </g>

  <!-- Providers -->
  <g transform="translate(250,100)">
    <rect width="150" height="44" rx="10" class="card"/>
    <text x="16" y="27" class="h">Provider A</text>
  </g>
  <g transform="translate(250,160)">
    <rect width="150" height="44" rx="10" class="card"/>
    <text x="16" y="27" class="h">Provider B</text>
  </g>
  <g transform="translate(250,220)">
    <rect width="150" height="44" rx="10" class="card"/>
    <text x="16" y="27" class="h">Provider C</text>
    <rect x="16" y="54" width="58" height="16" rx="8" fill="#0d9488"/>
    <text x="45" y="66" text-anchor="middle" class="tier">SMALL</text>
    <text x="84" y="66" class="s">searchers return rows, not pages</text>
  </g>

  <!-- Sort -->
  <g transform="translate(460,120)">
    <rect width="170" height="118" rx="12" class="card"/>
    <text x="16" y="30" class="h">Sort</text>
    <text x="16" y="52" class="s">rerank · source type</text>
    <text x="16" y="68" class="s">origin group · paywall</text>
    <text x="16" y="84" class="s">injection · triage</text>
    <text x="16" y="106" class="s" style="fill:#fbbf24">≈ $0.04 per 1M tokens</text>
    <rect x="16" y="-14" width="86" height="16" rx="8" fill="#d97706"/>
    <text x="59" y="-2" text-anchor="middle" class="tier">SYSTEM ONE</text>
  </g>

  <!-- Read -->
  <g transform="translate(690,120)">
    <rect width="170" height="118" rx="12" class="card"/>
    <text x="16" y="30" class="h">Read</text>
    <text x="16" y="52" class="s">passages with locations</text>
    <text x="16" y="68" class="s">claim ledger:</text>
    <text x="16" y="84" class="s">supported · partly ·</text>
    <text x="16" y="100" class="s">disputed · unverified</text>
    <rect x="16" y="-14" width="44" height="16" rx="8" fill="#2563eb"/>
    <text x="38" y="-2" text-anchor="middle" class="tier">MID</text>
  </g>

  <!-- Challenge -->
  <g transform="translate(920,120)">
    <rect width="170" height="118" rx="12" class="card"/>
    <text x="16" y="30" class="h">Challenge</text>
    <text x="16" y="52" class="s">fresh context</text>
    <text x="16" y="68" class="s">tries to overturn</text>
    <text x="16" y="84" class="s">each finding</text>
    <rect x="16" y="-14" width="48" height="16" rx="8" fill="#7c3aed"/>
    <text x="40" y="-2" text-anchor="middle" class="tier">TOP</text>
  </g>

  <!-- Outputs -->
  <g transform="translate(690,300)">
    <rect width="190" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="30" class="h" style="fill:#0f172a">brief.md</text>
    <text x="16" y="52" class="s" style="fill:#475569">600–900 words</text>
    <text x="16" y="68" class="s" style="fill:#475569">answer · 5 findings ·</text>
    <text x="16" y="84" class="s" style="fill:#475569">3 implications · what could</text>
    <text x="16" y="100" class="s" style="fill:#475569">change it · coverage line</text>
    <rect x="16" y="-14" width="48" height="16" rx="8" fill="#7c3aed"/>
    <text x="40" y="-2" text-anchor="middle" class="tier">TOP</text>
  </g>
  <g transform="translate(920,300)">
    <rect width="190" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="30" class="h" style="fill:#0f172a">evidence.md</text>
    <text x="16" y="52" class="s" style="fill:#475569">provider log · source</text>
    <text x="16" y="68" class="s" style="fill:#475569">register · claim ledger ·</text>
    <text x="16" y="84" class="s" style="fill:#475569">challenge record ·</text>
    <text x="16" y="100" class="s" style="fill:#475569">model and cost log</text>
  </g>

  <!-- Arrows -->
  <path d="M190,159 C215,159 225,122 250,122" class="line"/>
  <path d="M190,159 L250,182" class="line"/>
  <path d="M190,159 C215,159 225,242 250,242" class="line"/>
  <path d="M400,122 C430,122 430,179 460,179" class="line"/>
  <path d="M400,182 L460,182" class="line"/>
  <path d="M400,242 C430,242 430,185 460,185" class="line"/>
  <path d="M630,179 L690,179" class="line"/>
  <path d="M860,179 L920,179" class="line"/>
  <path d="M1005,238 C1005,270 790,250 785,300" class="line"/>
  <path d="M880,355 L920,355" class="line"/>

  <!-- Legend -->
  <g transform="translate(40,330)">
    <text x="0" y="0" class="h">Pay for judgement once</text>
    <text x="0" y="24" class="s">Top tier plans, challenges and writes.</text>
    <text x="0" y="42" class="s">Small tier searches. Mid tier reads.</text>
    <text x="0" y="60" class="s">A System One classifier sorts and pre-checks.</text>
    <text x="0" y="78" class="s">Code counts words and checks links.</text>
    <g transform="translate(340,-10)">
      <rect width="40" height="14" rx="7" fill="#7c3aed"/><text x="48" y="11" class="s">Opus 5.5 / GPT-6.1 Sol</text>
      <rect y="22" width="40" height="14" rx="7" fill="#2563eb"/><text x="48" y="33" class="s">Sonnet 5.5 / GPT-6.1 Sol</text>
      <rect y="44" width="40" height="14" rx="7" fill="#0d9488"/><text x="48" y="55" class="s">Haiku 4.5 / GPT-6 Luna</text>
      <rect y="66" width="40" height="14" rx="7" fill="#d97706"/><text x="48" y="77" class="s">TypeSafe Jev or another System One model</text>
    </g>
  </g>
</svg>
